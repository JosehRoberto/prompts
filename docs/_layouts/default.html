<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
      }
      h1, h2, h3, h4, h5, h6 {
        color: #2c3e50;
      }
      blockquote {
        background-color: #f8f9fa;
        border-left: 4px solid #3498db;
        margin: 1.5em 0;
        padding: 0.5em 1em;
        position: relative;
      }
      blockquote button {
        position: absolute;
        right: 10px;
        top: 10px;
        background: #3498db;
        color: white;
        border: none;
        border-radius: 3px;
        padding: 2px 6px;
        font-size: 12px;
        cursor: pointer;
        opacity: 0.7;
        transition: opacity 0.2s;
      }
      blockquote button:hover {
        opacity: 1;
      }
      pre {
        background-color: #f8f9fa;
        padding: 1em;
        overflow-x: auto;
        border-radius: 3px;
      }
      code {
        font-family: 'Courier New', Courier, monospace;
        background-color: #f1f3f4;
        padding: 2px 4px;
        border-radius: 3px;
      }
      a {
        color: #3498db;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .copy-success {
        background-color: #27ae60 !important;
      }
      .copy-error {
        background-color: #e74c3c !important;
      }
    </style>
  </head>
  <body>
    <div id="main-content">
      {{ content }}
    </div>
    <button id="copy-page-btn" style="margin-top:20px; padding:8px 16px; background:#3498db; color:white; border:none; border-radius:4px; cursor:pointer;">Copiar conteúdo da página</button>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // Copy buttons for blockquotes (except specific phrase)
        const blockquotes = document.querySelectorAll('blockquote');
        blockquotes.forEach(bq => {
          // Get the text content, removing leading/trailing whitespace
          let text = bq.innerText.trim();
          // Skip the specific blockquote that says "Arquivo já está em UTF-8 correto"
          if (text === "“Arquivo já está em UTF-8 correto”") {
            return;
          }
          // Create copy button
          const button = document.createElement('button');
          button.textContent = 'Copiar';
          button.title = 'Copiar texto';
          
          button.addEventListener('click', () => {
            // Copy the text as is (already trimmed)
            navigator.clipboard.writeText(text)
              .then(() => {
                button.textContent = 'Copiado!';
                button.classList.add('copy-success');
                setTimeout(() => {
                  button.textContent = 'Copiar';
                  button.classList.remove('copy-success');
                }, 2000);
              })
              .catch(err => {
                console.error('Failed to copy: ', err);
                button.textContent = 'Erro';
                button.classList.add('copy-error');
                setTimeout(() => {
                  button.textContent = 'Copiar';
                  button.classList.remove('copy-error');
                }, 2000);
              });
          });
          
          // Position the button
          bq.style.position = 'relative';
          bq.appendChild(button);
        });

        // Copy entire page content button
        const copyPageBtn = document.getElementById('copy-page-btn');
        if (copyPageBtn) {
          copyPageBtn.addEventListener('click', () => {
            const mainContent = document.getElementById('main-content');
            if (mainContent) {
              // Get text content, trim
              const text = mainContent.innerText.trim();
              navigator.clipboard.writeText(text)
                .then(() => {
                  copyPageBtn.textContent = 'Copiado!';
                  copyPageBtn.style.background = '#27ae60';
                  setTimeout(() => {
                    copyPageBtn.textContent = 'Copiar conteúdo da página';
                    copyPageBtn.style.background = '#3498db';
                  }, 2000);
                })
                .catch(err => {
                  console.error('Failed to copy: ', err);
                  copyPageBtn.textContent = 'Erro';
                  copyPageBtn.style.background = '#e74c3c';
                  setTimeout(() => {
                    copyPageBtn.textContent = 'Copiar conteúdo da página';
                    copyPageBtn.style.background = '#3498db';
                  }, 2000);
                });
            }
          });
        }
      });
    </script>
  </body>
</html>
